[package]
name = "klipp-bridge"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "JNI bridge between Klipp (Android) and the FilmCraft engine"

[lib]
name = "klipp_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The FilmCraft engine, pinned to a reviewed commit. Update rev deliberately.
filmcraft-engine = { git = "https://github.com/storytold/filmcraft", rev = "72831a4dc2ad79f43235bf0c175c9a58afdd67f0" }
# DSP (real-time audio effects, BS.1770 loudness) – same commit as the engine
filmcraft-audio-dsp = { git = "https://github.com/storytold/filmcraft", rev = "72831a4dc2ad79f43235bf0c175c9a58afdd67f0" }
filmcraft-media = { git = "https://github.com/storytold/filmcraft", rev = "72831a4dc2ad79f43235bf0c175c9a58afdd67f0" }
serde_json = "1"
# DeepFilterNet 3 (MIT OR Apache-2.0, code and model): speech/noise separation for the rendered noise reduction and
# speech enhance; inference via tract, the DFN3 model compiled in. Pinned to a reviewed commit.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "7b14b895fe7fc42cab72b4a4c1e49c982bd6404b", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
# held at the versions DeepFilterNet is built with (newer tract uses another ndarray and doesn't compile with it)
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
# the whole engine is optimized as one unit (faster DSP and decoding on the phone's cores; longer build)
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
