name: Build and test

on:
  push:
  pull_request:

jobs:
  android:
    name: App (unit tests, lint, release APK)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          # (the default also asks for the old "tools" package, which no longer exists)
          packages: platform-tools
      - name: NDK and CMake
        run: sdkmanager --install "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # the FilmCraft engine bridge (libklipp_bridge.so) is not in the repository – built here
      - name: Build the engine bridge
        working-directory: rust
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          RUSTFLAGS="--remap-path-prefix=$HOME=~" cargo ndk -t arm64-v8a --platform 29 -o ../app/src/main/jniLibs build --release
      # v5: Node 24 and MIT throughout (v6 moved its caching into a separately licensed, proprietary component)
      - uses: gradle/actions/setup-gradle@v5
      # every Rust crate in the bridge, every Maven library in the APK and every asset needs a reviewed license entry,
      # and LICENSES/inventory.json must be current (docs/licensing.md)
      - name: License inventory
        run: |
          ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-deps.txt"
          python3 tools/licenses/inventory.py check --gradle-deps "$RUNNER_TEMP/release-deps.txt"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Lint and release build
        run: ./gradlew lintRelease assembleRelease
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v7
        with:
          name: klipp-release-apk
          path: app/build/outputs/apk/release/app-release.apk

  bridge:
    name: Engine bridge (Rust tests)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test media (generated)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p "$RUNNER_TEMP/media" && cd "$RUNNER_TEMP/media"
          for n in a b; do
            ffmpeg -loglevel error -f lavfi -i testsrc=size=1280x720:rate=25:duration=10 -f lavfi -i sine=frequency=440:duration=10 \
              -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "klipp_$n.mp4"
          done
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=300:duration=8,volume='if(lt(mod(t,4),2),1,0)':eval=frame" -c:a aac tal.m4a
          # a camera file with three sound streams (deleting the second and third stream sounds)
          ffmpeg -loglevel error -f lavfi -i testsrc=size=1280x720:rate=25:duration=10 -f lavfi -i sine=frequency=440:duration=10 \
            -f lavfi -i sine=frequency=660:duration=10 -f lavfi -i sine=frequency=880:duration=10 \
            -map 0 -map 1 -map 2 -map 3 -c:v libx264 -pix_fmt yuv420p -c:a aac three.mov
          # real speech and real noise for the rendered noise reduction (DeepFilterNet's own sample clips, pinned commit)
          DF=https://raw.githubusercontent.com/Rikorose/DeepFilterNet/7b14b895fe7fc42cab72b4a4c1e49c982bd6404b/assets
          curl -sSfL "$DF/clean_freesound_33711.wav" -o df_clean.wav
          curl -sSfL "$DF/noise_freesound_2530.wav" -o df_noise_stereo.wav
          echo "2d885e9f45c0f9381aee09a397ecd160aff1875ffb75ebe2217d21c3511b0d5d  df_clean.wav" | sha256sum -c -
          echo "cc774d58170fc5b8f143345ef8ff31583feef71f23f447336fdd56c8478d8a8a  df_noise_stereo.wav" | sha256sum -c -
          ffmpeg -loglevel error -i df_noise_stereo.wav -ac 1 -c:a pcm_s16le df_noise.wav
      - name: Tests
        working-directory: rust
        run: KLIPP_TEST_MEDIA="$RUNNER_TEMP/media" cargo test --release

  regress-selftest:
    name: Regression checks (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # the checks' decoding (ffmpeg, ffprobe) and their arithmetic (numpy) – nothing else, no phone
      - name: ffmpeg and numpy
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-numpy
      # the regression run's checks against renders from the phone (tools/regress/fixtures) and broken copies of them:
      # each broken one must fail, the unbroken ones pass, and an error inside a run must end it with a failure
      - name: Self-test
        run: python3 tools/regress/selftest.py
